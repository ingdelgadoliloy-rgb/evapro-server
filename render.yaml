services:
  - type: web
    name: evapro-server
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: CLAUDE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: EVAPRO_DATA_FILE
        value: /tmp/evapro-store.json
      - key: ALLOWED_ORIGINS
        value: "https://evaluapro-utch.netlify.app,https://cartografia-examen.netlify.app"
