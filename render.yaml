services:
  - type: web
    name: evapro-server
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: CLAUDE_API_KEY
        sync: false
      - key: CLAUDE_MODELS
        value: "claude-sonnet-4-6,claude-sonnet-4-5-20250929,claude-haiku-4-5-20251001"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS
        value: "gemini-2.5-flash,gemini-2.5-flash-lite,gemini-2.0-flash"
      - key: ADMIN_SECRET
        sync: false
      - key: EVAPRO_DATA_FILE
        value: /tmp/evapro-store.json
      - key: JSON_BODY_LIMIT
        value: "70mb"
      - key: MAX_AI_FILE_BYTES
        value: "47185920"
      - key: MAX_AI_INLINE_FILE_BYTES
        value: "47185920"
      - key: GEMINI_INLINE_TOTAL_LIMIT
        value: "18874368"
      - key: ALLOWED_ORIGINS
        value: "https://evaluapro-utch.netlify.app,https://cartografia-examen.netlify.app"
